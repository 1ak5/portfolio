<!-- ============================================ 
     PROJECT CARDS DESIGN - COMPLETE STRUCTURE
     ============================================ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Cards Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ================ PROJECT CARDS CSS ================ */
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto 4rem;
            padding: 0 15px;
        }

        .project-card {
            background-color: #111111;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 10px rgba(255, 255, 255, 0.05);
            transition: transform 0.5s ease, box-shadow 0.5s ease, opacity 0.5s ease;
            will-change: transform, opacity;
            opacity: 0;
            transform: translateY(30px);
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .project-card.visible {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .dark-mode .project-card {
            background-color: #0a0a0a;
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 40px rgba(192, 192, 192, 0.15);
        }

        .project-img {
            position: relative;
            overflow: hidden;
        }

        .image {
            height: 100%;
            margin: 0;
            width: 100%;
            object-fit: cover;
        }

        .vdo {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s ease;
            margin-left: 0%;
        }

        .project-card:hover .project-img img {
            transform: scale(1.1);
        }

        .project-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(4px);
        }

        .project-card:hover .project-overlay {
            opacity: 1;
        }

        .project-links {
            display: flex;
            gap: 2rem;
        }

        .project-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #111111;
            font-size: 2rem;
            transform: translateY(20px);
            opacity: 0;
            transition: transform 0.5s ease, opacity 0.5s ease, background-color 0.5s ease, color 0.5s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-decoration: none;
        }

        .project-card:hover .project-link {
            transform: translateY(0);
            opacity: 1;
        }

        .project-card:hover .project-link:nth-child(2) {
            transition-delay: 0.1s;
        }

        .project-link:hover {
            background-color: #C0C0C0;
            color: white;
            transform: scale(1.1) translateY(-5px) !important;
        }

        .project-info {
            padding: 2rem;
        }

        .project-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
        }

        .project-desc {
            font-size: 1.5rem;
            color: #B0B0B0;
            margin-bottom: 1.5rem;
        }

        .dark-mode .project-desc {
            color: #cccccc;
        }

        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .tech-tag {
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            background-color: rgba(192, 192, 192, 0.1);
            color: #C0C0C0;
            border-radius: 20px;
        }

        /* ================ RESPONSIVE STYLES ================ */
        
        @media (max-width: 1024px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .projects-section {
                padding: 60px 0;
            }
        }

        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .projects-filter {
                gap: 1rem;
                margin-bottom: 3rem;
            }

            .filter-btn {
                padding: 0.6rem 1.5rem;
                font-size: 1.4rem;
            }

            .project-title {
                font-size: 1.8rem;
            }

            .project-desc {
                font-size: 1.4rem;
            }

            .projects-section {
                padding: 40px 0;
            }
        }

        @media (max-width: 480px) {
            .projects-grid {
                gap: 1.5rem;
            }

            .project-info {
                padding: 1.5rem;
            }

            .project-title {
                font-size: 1.6rem;
            }

            .project-desc {
                font-size: 1.3rem;
            }

            .tech-tag {
                font-size: 1rem;
                padding: 0.4rem 0.8rem;
            }

            .filter-btn {
                padding: 0.5rem 1rem;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- Project Cards Grid -->
    <div class="projects-grid">

            <!-- PROJECT CARD 1 -->
            <div class="project-card" data-category="web">
                <div class="project-img">
                    <img src="imgp1.png" class="image" loading="lazy" alt="Cloudrify Digital">
                    <div class="project-overlay">
                        <div class="project-links">
                            <a href="https://cloudrifydigital.com" class="project-link" target="_blank"><i
                                    class="fas fa-link"></i></a>
                        </div>
                    </div>
                </div>
                <div class="project-info">
                    <h3 class="project-title">Cloudrify Digital</h3>
                    <p class="project-desc" style="font-family: 'Comfortaa', cursive;">Stunning Modern Portfolio for
                        an Agency
                    </p>
                    <div class="project-tech">
                        <span class="tech-tag">React</span>
                        <span class="tech-tag">CSS</span>
                        <span class="tech-tag">javascript</span>
                        <span class="tech-tag">Nodejs</span>
                        <span class="tech-tag">Express</span>
                        <span class="tech-tag">MongoDB</span>
                        <span class="tech-tag">#FULL STACK</span>
                    </div>
                </div>
            </div>



        </div>

</body>
</html>
